[project]
name = "affinity-mcp"
version = "0.1.0"
description = "MCP server that lets Claude drive the Affinity design app on macOS via screenshots, mouse and keyboard"
readme = "README.md"
license = "MIT"
authors = [{ name = "resccrew" }]
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=2.2.0",
    "pillow>=12.3.0",
    "pyautogui>=0.9.54",
]

[project.scripts]
affinity-mcp = "affinity_mcp.server:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
